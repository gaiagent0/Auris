# Auris — Docker Compose
#
# CPU-only image: every speech engine runs on ONNX Runtime on the CPU, so a
# fresh clone builds and runs on any ARM64 machine, including Snapdragon X
# Elite. On Snapdragon the natively-installed path (reader/setup.bat +
# reader/run.bat) is faster — the ONNX engines (Supertonic, sherpa-onnx
# Supertonic, XTTSv2-ONNX cloning, Piper) run natively — and Docker here is a
# portable alternative.
services:
  auris:
    build:
      context: .
    image: auris:latest
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      # Names the browser uses to reach Auris; add your LAN host name if needed.
      AURIS_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./docker-data/data:/app/reader/data
      - ./docker-data/models:/app/reader/models
      - ./docker-data/exports:/app/reader/exports
      - ./docker-data/audio_cache:/app/reader/audio_cache
      - ./docker-data/uploads:/app/reader/uploads
      - ./model_backup:/app/model_backup
      - huggingface:/data/huggingface
    restart: unless-stopped

volumes:
  huggingface:
