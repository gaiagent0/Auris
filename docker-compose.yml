# Auris — Docker Compose
#
# Default: CPU-only image (TORCH_VARIANT=cpu) so a fresh clone builds and runs
# on any machine, including Snapdragon X Elite / ARM64. On Snapdragon the
# natively-installed path (reader/setup.bat + reader/run.bat) is faster — the
# ONNX CPU engines (Supertonic, sherpa-onnx Supertonic, Piper) run natively —
# and Docker here is a portable alternative that works anywhere.
#
# NVIDIA GPU build (opt-in, fast OmniVoice):  TORCH_VARIANT=cu128
#   docker compose build --build-arg TORCH_VARIANT=cu128
services:
  auris:
    build:
      context: .
      args:
        TORCH_VARIANT: cpu   # "cpu" by default; "cu128" for an NVIDIA GPU
    image: auris:latest
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      # Names the browser uses to reach Auris; add your LAN host name if needed.
      AURIS_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./docker-data/data:/app/reader/data
      - ./docker-data/models:/app/reader/models
      - ./docker-data/exports:/app/reader/exports
      - ./docker-data/audio_cache:/app/reader/audio_cache
      - ./docker-data/uploads:/app/reader/uploads
      - ./model_backup:/app/model_backup
      - huggingface:/data/huggingface
    restart: unless-stopped

volumes:
  huggingface:
