name: GitHub Release publikálása

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Kiadandó tag (pl. v5.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiadási eszköz tesztelése
        run: python -m unittest discover -s reader/tests -p "test_release_tool.py"

      - name: Tag és változásnapló ellenőrzése
        run: python scripts/release.py check --tag "$RELEASE_TAG"

      - name: Main ághoz tartozás ellenőrzése
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Kiadási jegyzet összeállítása
        run: python scripts/release.py notes --version "${RELEASE_TAG#v}" > release-notes.md

      - name: GitHub Release létrehozása
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A $RELEASE_TAG kiadás már létezik."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Auris ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi
